[versions]
paperVersion = "26.2.build.116-stable"
squaremapVersion = "1.3.15"
mccoroutineVersion = "2.22.0"
# Incendo Cloud コマンドフレームワーク（MoripaFishing 等 morinoparty 系プラグインと揃える）。
# cloud-core は安定版、cloud-paper は 2.0.0-SNAPSHOT を使う。
cloudVersion = "2.1.0"
cloudPaperVersion = "2.1.0-SNAPSHOT"
koinVersion = "4.2.2"
coroutineVersion = "1.11.0"
serializationVersion = "1.11.0"
protocolLibVersion = "5.3.0"
junitVersion = "6.1.3"
arrow-ktVersion = "2.2.3"
# データベース層。Kerria / MoripaFishing / MineAuth と同じ Exposed 1.3.x 系に揃える。
exposedVersion = "1.3.1"
sqliteVersion = "3.53.2.0"
# UUIDv7（time-ordered epoch）の採番。JDK / Kotlin stdlib は v4 しか生成できない。
uuidCreatorVersion = "6.1.1"
mineauthVersion = "0.3.7"
mockbukkitVersion = "4.116.3"
mockkVersion = "1.14.11"
# MockBukkit がターゲットとする paper-api（テスト実行時のみ使用）。
# main の paperVersion（26.x）とは意図的に別管理にしている。MockBukkit を 26.x の paper-api で
# 動かすと ServerMock の初期化に失敗するため、MockBukkit 側が対応するまでここは上げられない。
paperTestVersion = "1.21.11-R0.1-SNAPSHOT"

[libraries]
paper-api = { group = "io.papermc.paper", name = "paper-api", version.ref = "paperVersion" }
squaremap-api = { group = "xyz.jpenilla", name = "squaremap-api", version.ref = "squaremapVersion" }
cloud-core ={ group = "org.incendo", name = "cloud-core", version.ref = "cloudVersion" }
cloud-annotations = { group = "org.incendo", name = "cloud-annotations", version.ref = "cloudVersion" }
cloud-kotlin-coroutines-annotations = { group = "org.incendo", name = "cloud-kotlin-coroutines-annotations", version.ref = "cloudVersion" }
cloud-paper = { group = "org.incendo", name = "cloud-paper", version.ref = "cloudPaperVersion" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationVersion" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutineVersion" }
mccoroutine-bukkit-api = { group = "com.github.shynixn.mccoroutine", name = "mccoroutine-bukkit-api", version.ref = "mccoroutineVersion" }
mccoroutine-bukkit-core = { group = "com.github.shynixn.mccoroutine", name = "mccoroutine-bukkit-core", version.ref = "mccoroutineVersion" }
koin-core = { group = "io.insert-koin", name = "koin-core", version.ref = "koinVersion" }
protocolLib = { group = "com.comphenix.protocol", name = "ProtocolLib", version.ref = "protocolLibVersion" }
exposed-core = { group = "org.jetbrains.exposed", name = "exposed-core", version.ref = "exposedVersion" }
exposed-jdbc = { group = "org.jetbrains.exposed", name = "exposed-jdbc", version.ref = "exposedVersion" }
exposed-migration-jdbc = { group = "org.jetbrains.exposed", name = "exposed-migration-jdbc", version.ref = "exposedVersion" }
exposed-java-time = { group = "org.jetbrains.exposed", name = "exposed-java-time", version.ref = "exposedVersion" }
sqlite-jdbc = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqliteVersion" }
uuid-creator = { group = "com.github.f4b6a3", name = "uuid-creator", version.ref = "uuidCreatorVersion" }
arrow-core = { group = "io.arrow-kt", name = "arrow-core", version.ref = "arrow-ktVersion" }
arrow-fx-coroutines = { group = "io.arrow-kt", name = "arrow-fx-coroutines", version.ref = "arrow-ktVersion" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junitVersion" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
mineauth-api = { group = "party.morino", name = "mineauth-api", version.ref = "mineauthVersion" }
mockbukkit = { group = "org.mockbukkit.mockbukkit", name = "mockbukkit-v1.21", version.ref = "mockbukkitVersion" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockkVersion" }
paper-api-test = { group = "io.papermc.paper", name = "paper-api", version.ref = "paperTestVersion" }

[plugins]
run-paper = { id = "xyz.jpenilla.run-paper", version = "3.1.0" }
resource-factory = { id = "xyz.jpenilla.resource-factory", version = "1.3.1" }
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version = "2.4.10" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version = "2.4.10" }
detekt = { id = "dev.detekt", version = "2.0.0-alpha.6" }
spotless = { id = "com.diffplug.spotless", version = "8.10.0" }

[bundles]
commands-cloud = ["cloud-core", "cloud-paper", "cloud-annotations", "cloud-kotlin-coroutines-annotations"]
coroutines = ["mccoroutine-bukkit-api", "mccoroutine-bukkit-core", "kotlinx-coroutines-core"]
database = ["exposed-core", "exposed-jdbc", "exposed-migration-jdbc", "exposed-java-time", "sqlite-jdbc", "uuid-creator"]
